<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반 대항전 바퀴수 챌린지 · 기록 수합</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fbf6ee; --card:#ffffff; --ink:#3a2f2f; --muted:#8a7b78;
    --pink:#f4b8b0; --pink-d:#e0867a; --pink-l:#fde7e3;
    --line:#efe2d6; --gold:#e8b64c; --silver:#a9b2bd; --bronze:#c98b5a;
    --g1:#e0867a; --g2:#6f9fc9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.5}
  header{text-align:center;padding:28px 16px 8px}
  header h1{margin:0;font-size:30px;letter-spacing:-.5px}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  nav{display:flex;justify-content:center;gap:6px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  nav button{border:1px solid var(--line);background:#fff;padding:9px 18px;border-radius:999px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  nav button.on{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  section{display:none} section.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  h2{font-size:18px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--pink-l);color:var(--pink-d);font-weight:700}

  /* summary tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tile .k{font-size:13px;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:800;margin-top:2px}
  .tile .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}

  /* podium */
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:18px}
  .pod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
  .pod .medal{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:800}
  .pod .cls{font-size:22px;font-weight:800}
  .pod .sc{font-size:14px;color:var(--muted)}
  .pod .prize{font-size:12px;margin-top:6px;background:var(--pink-l);color:var(--pink-d);display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600}
  .pod.p1{padding:22px 16px;border-color:var(--gold);box-shadow:0 4px 14px rgba(232,182,76,.18)}
  .pod.p1 .cls{font-size:28px}
  .pod.empty{color:var(--muted)}

  /* class grid */
  .gradeHead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
  .gradeHead h3{margin:0;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .cc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .1s}
  .cc:hover{transform:translateY(-2px);border-color:var(--pink)}
  .cc .top{display:flex;justify-content:space-between;align-items:center}
  .cc .name{font-weight:800;font-size:16px}
  .cc .rk{font-size:12px;font-weight:700;color:var(--muted);background:#f6efe7;padding:1px 8px;border-radius:999px}
  .cc .rk.r1{background:var(--gold);color:#fff}.cc .rk.r2{background:var(--silver);color:#fff}.cc .rk.r3{background:var(--bronze);color:#fff}
  .cc .ppl{font-size:30px;font-weight:800;margin:4px 0 0;line-height:1.1}
  .cc .ppl small{font-size:14px;color:var(--muted);font-weight:600}
  .bar{height:7px;background:#f3ebe2;border-radius:99px;overflow:hidden;margin:8px 0 6px}
  .bar i{display:block;height:100%;background:var(--pink-d);border-radius:99px}
  .cc .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .cc .meta b{color:var(--ink)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;user-select:none}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr:hover{background:#fdf8f3}
  td.score{font-weight:800;color:var(--pink-d)}
  .tblwrap{overflow-x:auto}

  /* input */
  .entry{display:grid;grid-template-columns:120px 110px 1fr 110px auto;gap:10px;align-items:end}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--pink);border-color:var(--pink)}
  .btn{border:0;background:var(--pink-d);color:#fff;padding:11px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:#fff;color:#c0392b;border:1px solid #f0c9c3}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
  .hint{font-size:13px;margin-top:8px;min-height:20px}
  .hint.ok{color:#2e8b57}.hint.err{color:#c0392b}
  .split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
  td input{padding:5px 8px;width:80px;text-align:right}

  /* settings */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .dots{display:flex;gap:4px;margin:8px 0 6px}
  .dots i{flex:1;height:7px;border-radius:99px;background:#f3ebe2}
  .dots i.f{background:var(--pink-d)}
  .formula{background:var(--pink-l);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(58,47,47,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.on{display:flex}
  .modal .card{width:min(560px,100%);max-height:85vh;overflow:auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.on{opacity:1}

  @media (max-width:820px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .split{grid-template-columns:1fr}
    .entry{grid-template-columns:1fr 1fr}.entry>div:nth-child(3){grid-column:1/-1}
    .podium{grid-template-columns:1fr}
    .pod.p1{order:-1}
  }
  @media print{nav,.noprint{display:none!important} section{display:block!important} #tab-input,#tab-settings{display:none!important}}
</style>
</head>
<body>

<header>
  <h1>반 대항전 바퀴수 챌린지</h1>
  <p>10월 30일(금) 점심시간 · 제48기 학생자치회 여울 체육건강부</p>
</header>

<nav>
  <button data-tab="board" class="on">순위 보기</button>
  <button data-tab="input">기록 입력</button>
  <button data-tab="settings">점수 설정</button>
</nav>

<main>
  <!-- ===== 순위 ===== -->
  <section id="tab-board" class="on">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div class="seg" id="gradeFilter">
        <button data-g="all" class="on">전체</button>
        <button data-g="1">1학년</button>
        <button data-g="2">2학년</button>
      </div>
      <span class="muted" id="updated" style="font-size:13px"></span>
    </div>

    <div class="tiles" id="tiles"></div>
    <div class="podium" id="podium"></div>
    <div id="classGrids"></div>

    <div class="card" style="margin-top:22px">
      <h2>학급별 상세 순위</h2>
      <div class="tblwrap">
        <table id="rankTable">
          <thead><tr>
            <th data-k="rank">순위</th><th data-k="cls">학급</th>
            <th data-k="people">참여 인원</th><th data-k="partScore">참여 점수</th>
            <th data-k="laps">총 바퀴</th><th data-k="lapScore">바퀴 점수</th>
            <th data-k="bonusCount" id="thBonus">도장판 2장↑</th><th data-k="bonusScore">추가 점수</th>
            <th data-k="score">총점</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ===== 입력 ===== -->
  <section id="tab-input">
    <div class="card">
      <h2>기록지 입력</h2>
      <form id="entryForm" class="entry" autocomplete="off">
        <div><label for="fGrade">학년</label><select id="fGrade"><option value="1">1학년</option><option value="2">2학년</option></select></div>
        <div><label for="fClass">반</label><select id="fClass"></select></div>
        <div><label for="fName">이름</label><input id="fName" placeholder="이름" required></div>
        <div><label for="fLaps">바퀴 수</label><input id="fLaps" type="number" min="0" step="1" placeholder="도장 수" required></div>
        <div><button class="btn" type="submit">추가 (Enter)</button></div>
      </form>
      <div class="hint" id="entryHint"></div>
    </div>

    <div class="split">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">입력된 기록 <span class="muted" id="recCount" style="font-size:14px"></span></h2>
          <div class="row" style="gap:8px">
            <select id="recFilter" style="width:auto;padding:7px 10px"></select>
            <input id="recSearch" placeholder="이름 검색" style="width:130px;padding:7px 10px">
          </div>
        </div>
        <div class="tblwrap" style="max-height:520px;overflow:auto">
          <table id="recTable">
            <thead><tr><th>학급</th><th>이름</th><th>바퀴</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>반별 입력 현황</h2>
        <div class="tblwrap" style="max-height:560px;overflow:auto">
          <table id="progTable">
            <thead><tr><th>학급</th><th>인원</th><th>바퀴</th><th>총점</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 설정 ===== -->
  <section id="tab-settings">
    <div class="card">
      <h2>점수 계산 방식</h2>
      <div class="sgrid">
        <div><label>참여 인원 몇 명 단위로</label><input type="number" min="1" step="1" data-s="unitSize"></div>
        <div><label>한 단위당 참여 점수</label><input type="number" min="0" step="0.1" data-s="unitPoint"></div>
        <div><label>1바퀴당 점수</label><input type="number" min="0" step="0.1" data-s="lapPoint"></div>
        <div><label>도장판 한 장의 칸 수</label><input type="number" min="1" step="1" data-s="boardSize"></div>
        <div><label>추가 점수 기준 (도장판 몇 장 이상)</label><input type="number" min="1" step="1" data-s="bonusBoards"></div>
        <div><label>기준 달성 1명당 추가 점수</label><input type="number" min="0" step="0.1" data-s="bonusPoint"></div>
      </div>
      <div class="formula" id="formula"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>데이터 관리</h2>
      <p class="muted" style="margin-top:0;font-size:14px">입력한 기록은 <b>지금 쓰는 브라우저</b>에만 저장돼요. 다른 컴퓨터로 옮기거나 여러 명이 나눠 입력했다면 백업 파일로 내보내고 불러오세요.</p>
      <div class="row">
        <button class="btn ghost" id="exportJson">백업 파일 저장 (.json)</button>
        <label class="btn ghost" style="margin:0;color:var(--ink);font-size:15px">백업 불러오기(합치기)<input type="file" id="importJson" accept=".json" hidden></label>
        <button class="btn ghost" id="exportCsv">결과 엑셀용 저장 (.csv)</button>
        <button class="btn danger" id="resetAll">전체 초기화</button>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const CLASSES = {1:13, 2:12};           // 학년: 반 수
const KEY = 'lapChallenge.v2';
const PRIZES = ['과자 박스','담요','탐나는전/문화상품권'];
const DEFAULT_SETTINGS = {unitSize:5, unitPoint:10, lapPoint:1, boardSize:10, bonusBoards:2, bonusPoint:5};

let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.records)) return {records:s.records, settings:{...DEFAULT_SETTINGS,...s.settings}, updated:s.updated};
  }catch(e){}
  return {records:[], settings:{...DEFAULT_SETTINGS}, updated:null};
}
function save(){
  state.updated = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('저장 실패: 브라우저 저장소를 쓸 수 없어요'); }
  render();
}
const fmt = n => (Math.round(n*10)/10).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const validClass = (g,c)=> !!CLASSES[g] && c>=1 && c<=CLASSES[g];
const normName = s => String(s||'').replace(/\s+/g,'').trim();
const findRec = (g,c,name)=> state.records.find(r=>r.g===g && r.c===c && r.name===name);
const newId = ()=> (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());

/* ---------- 집계 ---------- */
function compute(){
  const S = state.settings;
  const unit = Math.max(1, +S.unitSize||1), perBoard = Math.max(1, +S.boardSize||1), need = (+S.bonusBoards||2)*perBoard;
  const rows = [];
  for(const g of [1,2]) for(let c=1;c<=CLASSES[g];c++){
    const recs = state.records.filter(r=>r.g===g && r.c===c);
    const people = recs.length;
    const laps = recs.reduce((a,r)=>a+r.laps,0);
    const bonusCount = recs.filter(r=>r.laps>=need).length;
    const units = Math.floor(people/unit);
    const partScore = units*(+S.unitPoint||0);
    const lapScore = laps*(+S.lapPoint||0);
    const bonusScore = bonusCount*(+S.bonusPoint||0);
    rows.push({g,c,cls:`${g}-${c}`,people,laps,bonusCount,units,toNext:unit-(people%unit),
      partScore,lapScore,bonusScore,score:Math.round((partScore+lapScore+bonusScore)*10)/10});
  }
  return rows;
}
function rankRows(rows){
  const sorted=[...rows].sort((a,b)=>b.score-a.score || b.people-a.people || b.laps-a.laps);
  let prev=null, rank=0;
  sorted.forEach((r,i)=>{ if(prev===null || r.score!==prev) rank=i+1; r.rank=rank; prev=r.score; });
  return sorted;
}
const dots = r => { const u=Math.max(1,+state.settings.unitSize||1), f=r.people%u; return `<div class="dots" title="다음 참여 점수까지 ${r.toNext}명">${Array.from({length:u},(_,i)=>`<i class="${i<f?'f':''}"></i>`).join('')}</div>`; };

/* ---------- 순위 화면 ---------- */
let gFilter='all', sortKey='rank', sortAsc=true;
function renderBoard(){
  const S=state.settings, all = compute();
  const view = rankRows(gFilter==='all' ? all : all.filter(r=>r.g==gFilter));
  const rankMap = Object.fromEntries(view.map(r=>[r.cls,r.rank]));

  const people = view.reduce((a,r)=>a+r.people,0), laps = view.reduce((a,r)=>a+r.laps,0);
  const joined = view.filter(r=>r.people>0).length, bonus = view.reduce((a,r)=>a+r.bonusCount,0);
  document.getElementById('tiles').innerHTML = `
    <div class="tile"><div class="k">총 참여 인원</div><div class="v">${people.toLocaleString()}<small>명</small></div></div>
    <div class="tile"><div class="k">총 바퀴 수</div><div class="v">${laps.toLocaleString()}<small>바퀴</small></div></div>
    <div class="tile"><div class="k">참여한 학급</div><div class="v">${joined}<small>/ ${view.length}반</small></div></div>
    <div class="tile"><div class="k">도장판 ${S.bonusBoards}장↑ 채운 사람</div><div class="v">${bonus}<small>명</small></div></div>`;
  document.getElementById('thBonus').textContent = `도장판 ${S.bonusBoards}장↑`;

  const top = view.filter(r=>r.score>0).slice(0,3);
  const medal=['var(--gold)','var(--silver)','var(--bronze)'];
  const pod = i => {
    const r = top[i];
    if(!r) return `<div class="pod empty p${i+1}"><div class="medal" style="background:#e8ddd2">${i+1}</div><div class="cls">–</div><div class="sc">기록 대기 중</div></div>`;
    return `<div class="pod p${i+1}"><div class="medal" style="background:${medal[r.rank-1]||'#ccc'}">${r.rank}</div>
      <div class="cls">${r.g}학년 ${r.c}반</div><div class="sc"><b style="color:var(--pink-d)">${fmt(r.score)}점</b> · ${r.people}명 · ${r.laps}바퀴</div>
      <div class="prize">${PRIZES[r.rank-1]}</div></div>`;
  };
  document.getElementById('podium').innerHTML = pod(1)+pod(0)+pod(2);

  const grades = gFilter==='all'?[1,2]:[+gFilter];
  document.getElementById('classGrids').innerHTML = grades.map(g=>{
    const rows = all.filter(r=>r.g===g);
    const gp = rows.reduce((a,r)=>a+r.people,0), gl = rows.reduce((a,r)=>a+r.laps,0);
    return `<div class="gradeHead"><h3>${g}학년</h3><span class="muted" style="font-size:13px">참여 ${gp}명 · ${gl}바퀴</span></div>
    <div class="grid">${rows.map(r=>{
      const rk = rankMap[r.cls];
      return `<div class="cc" data-cls="${r.cls}">
        <div class="top"><span class="name">${r.c}반</span><span class="rk ${r.score>0&&rk<=3?'r'+rk:''}">${r.score>0?rk+'위':'–'}</span></div>
        <div class="ppl">${r.people}<small>명 참여</small></div>
        ${dots(r)}
        <div class="meta"><span>참여 점수 <b>${fmt(r.partScore)}</b> <span style="font-size:12px">(+${r.toNext}명)</span></span></div>
        <div class="meta" style="margin-top:2px"><span><b>${r.laps}</b>바퀴</span><b style="color:var(--pink-d)">${fmt(r.score)}점</b></div>
      </div>`;}).join('')}</div>`;
  }).join('');

  const tb = [...view].sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(sortKey==='cls'){ x=a.g*100+a.c; y=b.g*100+b.c; }
    return (x<y?-1:x>y?1:0)*(sortAsc?1:-1);
  });
  document.querySelector('#rankTable tbody').innerHTML = tb.map(r=>`<tr>
    <td>${r.score>0?r.rank:'–'}</td><td>${r.g}학년 ${r.c}반</td>
    <td>${r.people}</td><td>${fmt(r.partScore)}</td>
    <td>${r.laps}</td><td>${fmt(r.lapScore)}</td>
    <td>${r.bonusCount}</td><td>${fmt(r.bonusScore)}</td>
    <td class="score">${fmt(r.score)}</td></tr>`).join('');

  document.getElementById('updated').textContent = state.updated ? '마지막 수정 '+new Date(state.updated).toLocaleString('ko-KR') : '';
}

/* ---------- 입력 화면 ---------- */
const fGrade=document.getElementById('fGrade'), fClass=document.getElementById('fClass'),
      fName=document.getElementById('fName'), fLaps=document.getElementById('fLaps'), hint=document.getElementById('entryHint');
const DEFAULT_HINT='학년·반은 입력 후에도 그대로 유지돼요. 같은 반 기록지는 이름과 바퀴 수만 이어서 넣으면 돼요.';
function fillClassOptions(){
  const g=+fGrade.value, keep=+fClass.value||1;
  fClass.innerHTML=Array.from({length:CLASSES[g]},(_,i)=>`<option value="${i+1}">${i+1}반</option>`).join('');
  fClass.value=String(Math.min(keep,CLASSES[g]));
}
fGrade.addEventListener('change',()=>{ fillClassOptions(); updateHint(); });
fClass.addEventListener('change',updateHint);
fName.addEventListener('input',updateHint);
function updateHint(){
  const g=+fGrade.value, c=+fClass.value, name=normName(fName.value);
  const ex = name && findRec(g,c,name);
  hint.className = ex?'hint ok':'hint';
  hint.textContent = ex ? `${g}학년 ${c}반 ${name}: 이미 ${ex.laps}바퀴 기록돼 있어요. 추가하면 합산돼요.` : DEFAULT_HINT;
}
document.getElementById('entryForm').addEventListener('submit',e=>{
  e.preventDefault();
  const g=+fGrade.value, c=+fClass.value, name=normName(fName.value), laps=parseInt(fLaps.value,10);
  if(!validClass(g,c)){ hint.className='hint err'; hint.textContent='학년·반을 확인해 주세요.'; return; }
  if(!name){ hint.className='hint err'; hint.textContent='이름을 입력해 주세요.'; fName.focus(); return; }
  if(!(laps>=0)){ hint.className='hint err'; hint.textContent='바퀴 수를 입력해 주세요.'; fLaps.focus(); return; }
  const ex = findRec(g,c,name);
  if(ex){ ex.laps += laps; ex.ts=Date.now(); toast(`${g}-${c} ${name} 합산 → 총 ${ex.laps}바퀴`); }
  else { state.records.push({id:newId(),g,c,name,laps,ts:Date.now()}); toast(`${g}학년 ${c}반 ${name} ${laps}바퀴 추가`); }
  save();
  fName.value=''; fLaps.value=''; updateHint(); fName.focus();
});

function renderInput(){
  const f = document.getElementById('recFilter'), cur = f.value || 'all';
  if(!f.options.length){
    let h='<option value="all">전체 학급</option>';
    for(const g of [1,2]) for(let c=1;c<=CLASSES[g];c++) h+=`<option value="${g}-${c}">${g}학년 ${c}반</option>`;
    f.innerHTML=h;
  }
  f.value=cur;
  const q = normName(document.getElementById('recSearch').value);
  let recs = [...state.records].sort((a,b)=>b.ts-a.ts);
  if(cur!=='all') recs = recs.filter(r=>`${r.g}-${r.c}`===cur).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(q) recs = recs.filter(r=>r.name.includes(q));
  document.getElementById('recCount').textContent = `(${recs.length}건)`;
  document.querySelector('#recTable tbody').innerHTML = recs.length ? recs.map(r=>`<tr>
    <td>${r.g}-${r.c}</td><td>${esc(r.name)}</td>
    <td><input type="number" min="0" value="${r.laps}" data-edit="${r.id}"></td>
    <td><button class="btn danger sm" data-del="${r.id}">삭제</button></td></tr>`).join('')
    : `<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">아직 입력된 기록이 없어요</td></tr>`;

  document.querySelector('#progTable tbody').innerHTML = compute().map(r=>`<tr>
    <td>${r.g}-${r.c}</td><td>${r.people}</td><td>${r.laps}</td><td>${fmt(r.score)}</td></tr>`).join('');
}
document.querySelector('#recTable').addEventListener('change',e=>{
  const id=e.target.dataset.edit; if(!id) return;
  const r=state.records.find(x=>x.id===id), v=parseInt(e.target.value,10);
  if(r && v>=0){ r.laps=v; save(); toast(`${r.g}-${r.c} ${r.name} → ${v}바퀴로 수정`); }
});
document.querySelector('#recTable').addEventListener('click',e=>{
  const id=e.target.dataset.del; if(!id) return;
  const r=state.records.find(x=>x.id===id);
  confirmBox(`${r.g}학년 ${r.c}반 ${esc(r.name)} 기록(${r.laps}바퀴)을 삭제할까요?`,()=>{ state.records=state.records.filter(x=>x.id!==id); save(); toast('삭제했어요'); });
});
document.getElementById('recFilter').addEventListener('change',renderInput);
document.getElementById('recSearch').addEventListener('input',renderInput);

/* ---------- 설정 ---------- */
function renderSettings(){
  const S=state.settings;
  document.querySelectorAll('[data-s]').forEach(i=>{ if(document.activeElement!==i) i.value=S[i.dataset.s]; });
  const need=S.bonusBoards*S.boardSize;
  const ex = {people:13, laps:150, bonus:3};
  const exPart=Math.floor(ex.people/S.unitSize)*S.unitPoint;
  document.getElementById('formula').innerHTML =
    `<b>학급 총점</b> = (참여 인원 ÷ ${S.unitSize}명, 나머지 버림) × ${S.unitPoint}점 + 총 바퀴 × ${S.lapPoint}점 + (${need}바퀴 이상 돈 사람 수) × ${S.bonusPoint}점
     <div class="muted" style="font-size:13px;margin-top:4px">예) ${ex.people}명 참여, 총 ${ex.laps}바퀴, ${need}바퀴 이상 ${ex.bonus}명 → ${fmt(exPart)} + ${fmt(ex.laps*S.lapPoint)} + ${fmt(ex.bonus*S.bonusPoint)} = <b>${fmt(exPart+ex.laps*S.lapPoint+ex.bonus*S.bonusPoint)}점</b>
     (${ex.people}명은 ${S.unitSize}명 단위 ${Math.floor(ex.people/S.unitSize)}개)</div>`;
}
document.getElementById('tab-settings').addEventListener('change',e=>{
  const t=e.target; if(!t.dataset.s) return;
  const v=parseFloat(t.value);
  const min = ['unitSize','boardSize','bonusBoards'].includes(t.dataset.s) ? 1 : 0;
  if(v>=min){ state.settings[t.dataset.s]=v; save(); } else renderSettings();
});
function download(name,text,type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
document.getElementById('exportJson').onclick=()=>download(`바퀴수챌린지_백업_${stamp()}.json`,JSON.stringify(state,null,1),'application/json');
document.getElementById('exportCsv').onclick=()=>{
  const n=x=>fmt(x).replace(/,/g,'');
  const head='순위,학년,반,참여 인원,참여 점수,총 바퀴,바퀴 점수,도장판 기준 달성,추가 점수,총점';
  const body=rankRows(compute()).map(r=>[r.score>0?r.rank:'',r.g,r.c,r.people,n(r.partScore),r.laps,n(r.lapScore),r.bonusCount,n(r.bonusScore),r.score].join(','));
  const recs=['','학년,반,이름,바퀴',...[...state.records].sort((a,b)=>a.g-b.g||a.c-b.c||a.name.localeCompare(b.name,'ko')).map(r=>[r.g,r.c,`"${r.name.replace(/"/g,'""')}"`,r.laps].join(','))];
  download(`바퀴수챌린지_결과_${stamp()}.csv`,'﻿'+[head,...body,...recs].join('\n'),'text/csv');
};
document.getElementById('importJson').onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.records)) throw 0;
    let added=0, merged=0, skipped=0;
    for(const r of data.records){
      const g=+r.g, c=+r.c, name=normName(r.name), laps=Math.max(0,parseInt(r.laps,10)||0);
      if(!validClass(g,c) || !name){ skipped++; continue; }
      if(state.records.some(x=>x.id===r.id)){ skipped++; continue; }   // 이미 불러온 기록
      const ex=findRec(g,c,name);
      if(ex){ ex.laps+=laps; merged++; }
      else { state.records.push({id:r.id||newId(),g,c,name,laps,ts:r.ts||Date.now()}); added++; }
    }
    save(); toast(`새 기록 ${added}건, 같은 이름 합산 ${merged}건${skipped?`, 건너뜀 ${skipped}건`:''}`);
  }catch(err){ toast('백업 파일을 읽을 수 없어요'); }
  e.target.value='';
};
document.getElementById('resetAll').onclick=()=>confirmBox('입력한 기록을 모두 지울까요? (점수 설정은 유지돼요)<br><span class="muted">지우기 전에 백업 파일을 저장해 두는 걸 권장해요.</span>',()=>{ state.records=[]; save(); toast('기록을 모두 지웠어요'); });

/* ---------- 학급 상세 ---------- */
document.getElementById('classGrids').addEventListener('click',e=>{
  const card=e.target.closest('.cc'); if(!card) return;
  const [g,c]=card.dataset.cls.split('-').map(Number);
  const r=compute().find(x=>x.g===g&&x.c===c);
  const recs=state.records.filter(x=>x.g===g&&x.c===c).sort((a,b)=>b.laps-a.laps);
  const need=state.settings.bonusBoards*state.settings.boardSize;
  openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${g}학년 ${c}반</h2><button class="btn ghost sm" data-close>닫기</button></div>
    <p class="muted" style="margin:6px 0 12px">참여 ${r.people}명 · 총 ${r.laps}바퀴 · <b style="color:var(--pink-d)">${fmt(r.score)}점</b>
    <br>참여 ${fmt(r.partScore)} + 바퀴 ${fmt(r.lapScore)} + 추가 ${fmt(r.bonusScore)} · 다음 참여 점수까지 ${r.toNext}명</p>
    <table><thead><tr><th>#</th><th>이름</th><th>바퀴</th></tr></thead><tbody>
    ${recs.length?recs.map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(x.name)} ${x.laps>=need?'<span style="font-size:11px;padding:1px 6px;background:var(--pink-l);color:var(--pink-d);border-radius:99px;font-weight:600">추가점수</span>':''}</td><td>${x.laps}</td></tr>`).join(''):'<tr><td colspan="3" class="muted" style="text-align:center">기록 없음</td></tr>'}
    </tbody></table>`);
});

/* ---------- 공통 ---------- */
const modal=document.getElementById('modal');
function openModal(html){ document.getElementById('modalBody').innerHTML=html; modal.classList.add('on'); }
modal.addEventListener('click',e=>{ if(e.target===modal||e.target.dataset.close!==undefined) modal.classList.remove('on'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') modal.classList.remove('on'); });
function confirmBox(msg,ok){
  openModal(`<p style="margin-top:0">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>취소</button><button class="btn" id="okBtn">확인</button></div>`);
  document.getElementById('okBtn').onclick=()=>{ modal.classList.remove('on'); ok(); };
}
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='tab-'+b.dataset.tab));
  if(b.dataset.tab==='input') setTimeout(()=>fName.focus(),0);
});
document.querySelectorAll('#gradeFilter button').forEach(b=>b.onclick=()=>{
  gFilter=b.dataset.g; document.querySelectorAll('#gradeFilter button').forEach(x=>x.classList.toggle('on',x===b)); renderBoard();
});
document.querySelectorAll('#rankTable th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=(k==='rank'||k==='cls'); } renderBoard();
});
window.addEventListener('storage',e=>{ if(e.key===KEY){ state=load(); render(); } });

function render(){ renderBoard(); renderInput(); renderSettings(); }
fillClassOptions(); updateHint(); render();
</script>
</body>
</html>
